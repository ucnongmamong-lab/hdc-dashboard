<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard รายงานผลการดำเนินงาน อ.หนองมะโมง</title>
    
    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0369a1', // sky-700
                        secondary: '#0ea5e9', // sky-500
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Modal Transition */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            transform: scale(0.95) translateY(10px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Mobile Drawer Transition */
        #mobileDrawer {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }
        #mobileDrawer.open {
            transform: translateX(0);
        }
        #mobileDrawerBackdrop {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out;
        }
        #mobileDrawerBackdrop.open {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex">

    <!-- ================= Sidebar (Desktop) ================= -->
    <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 shadow-sm h-full z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <i class="ph-fill ph-hospital text-primary text-2xl mr-2"></i>
            <h1 class="font-bold text-lg text-slate-800 tracking-wide">NongMamong <span class="text-primary">Dash</span></h1>
        </div>
        <div class="flex-1 overflow-y-auto py-4 px-3" id="desktopMenu">
            <!-- Menu items will be injected here -->
        </div>
        <div class="p-4 border-t border-slate-100 text-xs text-center text-slate-400">
            © 2026 Nong Mamong Hospital
        </div>
    </aside>

    <!-- ================= Mobile Drawer ================= -->
    <div id="mobileDrawerBackdrop" class="fixed inset-0 bg-slate-900/50 z-40 lg:hidden"></div>
    <aside id="mobileDrawer" class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-50 flex flex-col lg:hidden">
        <div class="h-16 flex items-center justify-between px-4 border-b border-slate-100">
            <div class="flex items-center">
                <i class="ph-fill ph-hospital text-primary text-2xl mr-2"></i>
                <h1 class="font-bold text-lg text-slate-800">NongMamong</h1>
            </div>
            <button id="closeDrawerBtn" class="text-slate-400 hover:text-slate-600 focus:outline-none p-1">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto py-4 px-3" id="mobileMenu">
            <!-- Menu items will be injected here -->
        </div>
    </aside>

    <!-- ================= Main Content ================= -->
    <main class="flex-1 flex flex-col h-full relative w-full min-w-0">
        
        <!-- Top Navbar -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 z-10 shrink-0">
            <div class="flex items-center">
                <button id="openDrawerBtn" class="lg:hidden text-slate-500 hover:text-primary focus:outline-none mr-3">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <label for="yearSelect" class="text-sm font-medium text-slate-500 hidden sm:block">ปีงบประมาณ:</label>
                    <select id="yearSelect" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-primary focus:border-primary block p-2">
                        <option value="2569">2569</option>
                        <option value="2568">2568</option>
                        <option value="2567">2567</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="hidden sm:block text-right">
                    <div class="text-sm font-semibold text-slate-700">นายสมเกียรติ อุทัยวงษ์</div>
                    <div class="text-xs text-slate-500">พยาบาลวิชาชีพชำนาญการ</div>
                </div>
                <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center text-primary border border-primary/20">
                    <i class="ph-fill ph-user text-lg"></i>
                </div>
            </div>
        </header>

        <!-- Dashboard Content Area -->
        <div class="flex-1 overflow-y-auto bg-slate-50 p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
                
                <!-- Category Header -->
                <div class="mb-6 sm:mb-8 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                    <div>
                        <h2 id="categoryTitle" class="text-xl sm:text-2xl font-bold text-slate-800">โหลดข้อมูล...</h2>
                        <p id="categoryDesc" class="text-sm text-slate-500 mt-1">กำลังเตรียมข้อมูลตัวชี้วัด</p>
                    </div>
                    <div class="bg-white px-3 py-2 rounded-lg border border-slate-200 shadow-sm flex items-center text-sm font-medium text-slate-600 w-fit">
                        <i class="ph-fill ph-calendar-blank text-primary mr-2"></i>
                        ข้อมูลอัปเดตล่าสุด: <span class="ml-1 text-slate-800" id="lastUpdateText"></span>
                    </div>
                </div>

                <!-- KPI Grid -->
                <div id="kpiGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-6">
                    <!-- KPI Cards will be injected here -->
                </div>
                
            </div>
        </div>
    </main>

    <!-- ================= Modal (ตารางรายละเอียดหน่วยบริการ) ================= -->
    <div id="dataModal" class="modal-overlay fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 sm:p-6">
        <div class="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            
            <!-- Modal Header -->
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-start bg-slate-50/50 shrink-0">
                <div class="pr-4">
                    <h3 id="modalKpiTitle" class="text-lg sm:text-xl font-bold text-slate-800 mb-1 leading-tight">ชื่อตัวชี้วัด</h3>
                    <div class="flex flex-wrap items-center gap-2 text-sm">
                        <span id="modalYearBadge" class="bg-primary/10 text-primary px-2 py-0.5 rounded font-medium">ปีงบประมาณ</span>
                        <span id="modalKpiTarget" class="text-slate-600 font-medium">เป้าหมาย: -</span>
                    </div>
                </div>
                <button id="closeModalBtn" class="text-slate-400 hover:bg-slate-200 hover:text-slate-700 p-1.5 rounded-full transition-colors focus:outline-none shrink-0">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Body (Table) -->
            <div class="p-0 overflow-auto flex-1">
                <table class="w-full text-sm text-left whitespace-nowrap">
                    <thead class="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th scope="col" class="px-4 sm:px-6 py-3 text-center w-12">ลำดับ</th>
                            <th scope="col" class="px-3 sm:px-6 py-3">รหัส</th>
                            <th scope="col" class="px-4 sm:px-6 py-3">หน่วยบริการ</th>
                            <th scope="col" class="px-3 sm:px-6 py-3 text-center">เกณฑ์ (%)</th>
                            <th scope="col" class="px-4 sm:px-6 py-3 text-right">ผลงาน (%)</th>
                            <th scope="col" class="px-4 sm:px-6 py-3 text-center w-24">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody" class="divide-y divide-slate-100">
                        <!-- Table rows injected via JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Modal Footer -->
            <div class="px-5 py-3 border-t border-slate-100 bg-slate-50 flex justify-between items-center shrink-0">
                <span id="modalTimestamp" class="text-xs text-slate-500">ข้อมูลล่าสุด</span>
                <button id="closeModalBtnFooter" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-200">
                    ปิดหน้าต่าง
                </button>
            </div>
        </div>
    </div>

    <!-- ================= JavaScript Logic ================= -->
    <script>
        // ข้อมูลหน่วยบริการ อ.หนองมะโมง 8 แห่ง
        const hospitalNames = [
            'โรงพยาบาลส่งเสริมสุขภาพตำบลหนองมะโมง',
            'โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านหนองตะขบ',
            'โรงพยาบาลส่งเสริมสุขภาพตำบลวังตะเคียน',
            'โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านวังตะเคียน',
            'โรงพยาบาลส่งเสริมสุขภาพตำบลสะพานหิน',
            'โรงพยาบาลส่งเสริมสุขภาพตำบลบ้านน้ำพุ',
            'โรงพยาบาลส่งเสริมสุขภาพตำบลกุดจอก',
            'โรงพยาบาลหนองมะโมง'
        ];

        // รหัสสถานบริการ (HCODE)
        const mockCodes = [
            '01666', '01667', '01668', '01669', 
            '01670', '01671', '01672', '27974'
        ];

        // โครงสร้างหมวดหมู่และตัวชี้วัด (Blueprint)
        const categoryBlueprint = [
            {
                id: 'qof',
                icon: 'ph-star',
                title: 'ตัวชี้วัด QOF',
                desc: 'Quality and Outcomes Framework',
                kpis: [
                    { id: 'qof1', title: 'อัตราการตรวจคัดกรองเบาหวานในประชากร 35 ปีขึ้นไป', target: '>=90', condition: '>=', baseTarget: 90, max: 100 },
                    { id: 'qof2', title: 'อัตราการตรวจคัดกรองความดันโลหิตสูงในประชากร 35 ปีขึ้นไป', target: '>=90', condition: '>=', baseTarget: 90, max: 100 },
                    { id: 'qof3', title: 'หญิงตั้งครรภ์ได้รับการฝากครรภ์ครั้งแรกก่อน 12 สัปดาห์', target: '>=75', condition: '>=', baseTarget: 75, max: 100 },
                    { id: 'qof4', title: 'เด็กอายุ 1 ปี ได้รับวัคซีนครบตามเกณฑ์', target: '>=90', condition: '>=', baseTarget: 90, max: 100 }
                ]
            },
            {
                id: 'health_promo',
                icon: 'ph-heartbeat',
                title: 'ส่งเสริมสุขภาพและป้องกันโรค',
                desc: 'Health Promotion & Prevention',
                kpis: [
                    { id: 'hp1', title: 'อัตราการคัดกรองมะเร็งปากมดลูก (สตรี 30-59 ปี)', target: '>=20', condition: '>=', baseTarget: 20, max: 100 },
                    { id: 'hp2', title: 'พัฒนาการเด็กสมวัย (0-5 ปี)', target: '>=85', condition: '>=', baseTarget: 85, max: 100 },
                    { id: 'hp3', title: 'อัตราการตั้งครรภ์ซ้ำในวัยรุ่น (15-19 ปี)', target: '<=10', condition: '<=', baseTarget: 10, max: 100 }
                ]
            },
            {
                id: 'ncd',
                icon: 'ph-activity',
                title: 'โรคไม่ติดต่อเรื้อรัง (NCDs)',
                desc: 'Non-Communicable Diseases',
                kpis: [
                    { id: 'ncd1', title: 'ผู้ป่วยเบาหวานควบคุมน้ำตาลได้ (HbA1c < 7%)', target: '>=40', condition: '>=', baseTarget: 40, max: 100 },
                    { id: 'ncd2', title: 'ผู้ป่วยความดันโลหิตสูงควบคุมความดันได้', target: '>=60', condition: '>=', baseTarget: 60, max: 100 },
                    { id: 'ncd3', title: 'ผู้ป่วย NCDs ได้รับการประเมิน CVD Risk', target: '>=90', condition: '>=', baseTarget: 90, max: 100 }
                ]
            }
        ];

        // ตัวแปรเก็บสถานะ
        let currentYear = '2569';
        let currentCategory = 'qof';
        let currentData = {};
        let chartInstances = [];

        // ฟังก์ชันสุ่มตัวเลขแบบกำหนด Seed (เพื่อให้ค่าเดิมเมื่อเลือกปีเดิม)
        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        // ฟังก์ชันสร้าง Mock Data ตามปีงบประมาณ
        function generateDataForYear(year) {
            const yearSeed = parseInt(year);
            const data = JSON.parse(JSON.stringify(categoryBlueprint)); // Deep copy
            
            data.forEach(cat => {
                cat.kpis.forEach(kpi => {
                    const seed = yearSeed + kpi.id.charCodeAt(0);
                    
                    let baseValue;
                    if (kpi.condition === '>=') {
                        baseValue = kpi.baseTarget - 10 + (seededRandom(seed) * 20); 
                    } else {
                        baseValue = kpi.baseTarget - 5 + (seededRandom(seed) * 15);
                    }
                    
                    if (baseValue > kpi.max) baseValue = kpi.max;
                    if (baseValue < 0) baseValue = 0;
                    
                    kpi.value = parseFloat(baseValue.toFixed(2));
                });
            });
            return data;
        }

        // ตรวจสอบว่าผ่านเกณฑ์หรือไม่
        function checkPass(value, targetStr) {
            if (targetStr.startsWith('>=')) return value >= parseFloat(targetStr.replace('>=', ''));
            if (targetStr.startsWith('<=')) return value <= parseFloat(targetStr.replace('<=', ''));
            if (targetStr.startsWith('>')) return value > parseFloat(targetStr.replace('>', ''));
            if (targetStr.startsWith('<')) return value < parseFloat(targetStr.replace('<', ''));
            return value == parseFloat(targetStr);
        }

        // สร้างเมนูด้านซ้าย (รองรับทั้ง Desktop และ Mobile)
        function renderMenu() {
            const desktopMenu = document.getElementById('desktopMenu');
            const mobileMenu = document.getElementById('mobileMenu');
            let html = '<ul class="space-y-1.5">';
            
            categoryBlueprint.forEach(cat => {
                const isActive = cat.id === currentCategory;
                const activeClass = isActive 
                    ? 'bg-primary/10 text-primary font-semibold border-r-4 border-primary' 
                    : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 border-r-4 border-transparent';
                
                html += `
                    <li>
                        <button onclick="selectCategory('${cat.id}')" 
                            class="w-full flex items-center px-3 py-2.5 rounded-l-lg transition-colors text-left ${activeClass}">
                            <i class="${isActive ? 'ph-fill' : 'ph'} ${cat.icon} text-lg mr-3"></i>
                            <span class="text-sm truncate">${cat.title}</span>
                        </button>
                    </li>
                `;
            });
            html += '</ul>';
            
            desktopMenu.innerHTML = html;
            mobileMenu.innerHTML = html;
        }

        // เลือกหมวดหมู่และโหลดข้อมูล
        window.selectCategory = function(catId) {
            currentCategory = catId;
            renderMenu();
            loadCategoryData(catId);
            closeMobileDrawer();
        };

        // วาดกราฟครึ่งวงกลม (Gauge Chart)
        function createGaugeChart(canvasId, value, targetStr, max) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const isPass = checkPass(value, targetStr);
            const color = isPass ? '#10b981' : '#f43f5e'; // Emerald (Pass) or Rose (Fail)
            
            return new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [value, max - value],
                        backgroundColor: [color, '#e2e8f0'],
                        borderWidth: 0,
                        circumference: 180,
                        rotation: 270,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: { tooltip: { enabled: false }, legend: { display: false } },
                    animation: { animateRotate: true, animateScale: false, duration: 1000 }
                }
            });
        }

        // โหลดข้อมูลและแสดงผล Card ในหน้าหลัก
        function loadCategoryData(catId, destroyCharts = true) {
            const catData = currentData.find(c => c.id === catId);
            if (!catData) return;

            document.getElementById('categoryTitle').innerText = catData.title;
            document.getElementById('categoryDesc').innerText = catData.desc;
            
            const now = new Date();
            document.getElementById('lastUpdateText').innerText = `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()+543}`;

            const grid = document.getElementById('kpiGrid');
            grid.innerHTML = '';
            
            if (destroyCharts) {
                chartInstances.forEach(chart => chart.destroy());
                chartInstances = [];
            }

            catData.kpis.forEach(kpi => {
                const isPass = checkPass(kpi.value, kpi.target);
                const statusColor = isPass ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : 'text-rose-600 bg-rose-50 border-rose-200';
                const statusIcon = isPass ? 'ph-check-circle' : 'ph-x-circle';
                const statusText = isPass ? 'ผ่านเกณฑ์' : 'ไม่ผ่านเกณฑ์';
                const canvasId = `chart-${kpi.id}`;

                const cardHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col hover:shadow-md transition-shadow cursor-pointer" onclick="openModal('${kpi.id}')">
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-semibold text-slate-800 text-sm sm:text-base leading-snug line-clamp-2">${kpi.title}</h3>
                            </div>
                            <div class="text-xs text-slate-500 mb-4 bg-slate-50 inline-block px-2 py-1 rounded">เป้าหมาย: ${kpi.target}</div>
                            
                            <div class="relative h-24 sm:h-28 w-full flex items-end justify-center mb-2">
                                <canvas id="${canvasId}"></canvas>
                                <div class="absolute inset-0 flex flex-col items-center justify-end pb-2">
                                    <span class="text-2xl sm:text-3xl font-bold ${isPass ? 'text-emerald-600' : 'text-rose-600'}">${kpi.value}%</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div class="flex items-center px-2.5 py-1 rounded-full text-xs font-medium border ${statusColor}">
                                <i class="ph-fill ${statusIcon} mr-1.5 text-sm"></i>
                                ${statusText}
                            </div>
                            <div class="text-xs text-primary hover:text-sky-800 font-medium flex items-center">
                                ดูราย รพ.สต. <i class="ph ph-arrow-right ml-1"></i>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });

            // วาดกราฟหลังจากที่ Card ถูกสร้างใน DOM แล้ว
            setTimeout(() => {
                catData.kpis.forEach(kpi => {
                    const canvasId = `chart-${kpi.id}`;
                    const chart = createGaugeChart(canvasId, kpi.value, kpi.target, kpi.max);
                    chartInstances.push(chart);
                });
            }, 10);
        }

        // ฟังก์ชันเปิด Modal พร้อมแสดงข้อมูล 8 แห่ง
        window.openModal = function(kpiId) {
            const catData = currentData.find(c => c.id === currentCategory);
            const kpi = catData.kpis.find(k => k.id === kpiId);
            
            const modal = document.getElementById('dataModal');
            document.getElementById('modalKpiTitle').innerText = kpi.title;
            document.getElementById('modalKpiTarget').innerText = `อ.หนองมะโมง: ${kpi.value}% (เป้าหมาย: ${kpi.target})`;
            document.getElementById('modalYearBadge').innerText = `ปีงบประมาณ ${currentYear}`;
            document.getElementById('modalTimestamp').innerText = `ข้อมูลปี ${currentYear} ล่าสุด`;
            
            const tbody = document.getElementById('modalTableBody');
            tbody.innerHTML = '';
            
            const listSize = hospitalNames.length;
            
            for (let i = 0; i < listSize; i++) {
                // คำนวณค่าผลงานจำลองแยกตามหน่วยบริการ
                const seed = i + parseInt(currentYear) + kpi.id.charCodeAt(0);
                let modifier = (seededRandom(seed) * 30) - 15;
                let hValue = kpi.value + modifier;
                
                if (hValue > kpi.max) hValue = kpi.max;
                if (hValue > 100 && kpi.max <= 100) hValue = 100;
                if (hValue < 0) hValue = 0;
                
                hValue = parseFloat(hValue.toFixed(1));
                const isPass = checkPass(hValue, kpi.target);
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                
                const statusBadge = isPass 
                    ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] sm:text-xs font-medium bg-emerald-100 text-emerald-800"><i class="ph-fill ph-check-circle mr-1"></i> ผ่าน</span>`
                    : `<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] sm:text-xs font-medium bg-rose-100 text-rose-800"><i class="ph-fill ph-x-circle mr-1"></i> ไม่ผ่าน</span>`;
                
                tr.innerHTML = `
                    <td class="px-4 sm:px-6 py-3 text-center text-slate-400 font-medium">${i + 1}</td>
                    <td class="px-3 sm:px-6 py-3 font-mono text-slate-500 text-sm">${mockCodes[i]}</td>
                    <td class="px-4 sm:px-6 py-3 font-medium text-slate-800">${hospitalNames[i]}</td>
                    <td class="px-3 sm:px-6 py-3 text-center text-slate-500">${kpi.target}</td>
                    <td class="px-4 sm:px-6 py-3 text-right font-bold ${isPass ? 'text-emerald-600' : 'text-rose-600'}">${hValue}%</td>
                    <td class="px-4 sm:px-6 py-3 text-center">${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            }
            
            modal.classList.add('active');
        }

        // ฟังก์ชันควบคุม UI อื่นๆ
        function closeModal() {
            document.getElementById('dataModal').classList.remove('active');
        }

        function openMobileDrawer() {
            document.getElementById('mobileDrawer').classList.add('open');
            document.getElementById('mobileDrawerBackdrop').classList.add('open');
        }

        function closeMobileDrawer() {
            document.getElementById('mobileDrawer').classList.remove('open');
            document.getElementById('mobileDrawerBackdrop').classList.remove('open');
        }

        // Event Listeners
        document.getElementById('openDrawerBtn').addEventListener('click', openMobileDrawer);
        document.getElementById('closeDrawerBtn').addEventListener('click', closeMobileDrawer);
        document.getElementById('mobileDrawerBackdrop').addEventListener('click', closeMobileDrawer);
        
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('closeModalBtnFooter').addEventListener('click', closeModal);
        
        document.getElementById('dataModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('yearSelect').addEventListener('change', function(e) {
            currentYear = e.target.value;
            currentData = generateDataForYear(currentYear);
            loadCategoryData(currentCategory, true);
        });

        window.addEventListener('resize', () => {
            chartInstances.forEach(chart => {
                if (chart) chart.resize();
            });
        });

        // Initialize System
        function initDashboard() {
            currentData = generateDataForYear(currentYear);
            renderMenu();
            loadCategoryData(currentCategory);
        }

        document.addEventListener('DOMContentLoaded', initDashboard);

    </script>
</body>
</html>
